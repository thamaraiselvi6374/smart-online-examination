<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-body d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="glass-card p-4 p-md-5" style="max-width: 540px; width: 100%;">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-2"><i class="fas fa-user-plus"></i></div>
            <h3 class="fw-bold mb-1">Student Registration</h3>
            <p class="text-secondary text-sm">Create your account to start attending online examinations.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div>

        <form th:action="@{/register}" th:object="${userDto}" method="post">
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Full Name</label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="John Doe" required>
                <div class="text-danger text-xs mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Username</label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="johndoe" required>
                <div class="text-danger text-xs mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
                <div class="text-danger text-xs mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Phone Number</label>
                <input type="text" th:field="*{phone}" class="form-control" placeholder="+1 234 567 890">
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary fw-semibold">Password</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                <div class="text-danger text-xs mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 mb-3">Register Student Account</button>
            <div class="text-center">
                <a href="/login" class="text-secondary text-decoration-none text-sm">Already have an account? <span class="text-primary fw-semibold">Login</span></a>
            </div>
        </form>
    </div>
</body>
</html>
