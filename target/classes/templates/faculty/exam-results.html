<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exam Results - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='dashboard')}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/header :: navbar(pageTitle='Student Results & Evaluation Analytics')}"></div>

            <div class="p-4">
                <div class="glass-card p-4 mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary text-uppercase" th:text="${exam.subject.name}">Subject</span>
                            <h4 class="fw-bold mb-1 mt-1" th:text="${exam.title}">Exam Title</h4>
                            <div class="text-sm text-secondary">
                                Total Submissions: <strong th:text="${#lists.size(attempts)}">0</strong> | 
                                Average Score: <strong class="text-primary" th:text="${avgPercentage + '%'}">0%</strong> | 
                                Pass Count: <strong class="text-success" th:text="${passCount}">0</strong>
                            </div>
                        </div>
                        <a href="/faculty/dashboard" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Back to Dashboard</a>
                    </div>
                </div>

                <div class="glass-card p-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-user-check me-2 text-primary"></i>Student Performance Roster</h5>
                    <div class="table-responsive">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>Student Name</th>
                                    <th>Email</th>
                                    <th>Submitted At</th>
                                    <th>Correct</th>
                                    <th>Wrong</th>
                                    <th>Marks Obtained</th>
                                    <th>Percentage</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="att : ${attempts}">
                                    <td class="fw-bold" th:text="${att.student.fullName}">Student</td>
                                    <td th:text="${att.student.email}">Email</td>
                                    <td th:text="${#temporals.format(att.submitTime, 'yyyy-MM-dd HH:mm')}">Date</td>
                                    <td class="text-success fw-semibold" th:text="${att.correctAnswers}">0</td>
                                    <td class="text-danger fw-semibold" th:text="${att.wrongAnswers}">0</td>
                                    <td class="fw-bold" th:text="${att.marksObtained + ' / ' + att.totalMarks}">15/20</td>
                                    <td class="fw-bold text-primary" th:text="${att.percentage + '%'}">75%</td>
                                    <td>
                                        <span class="badge-custom" th:classappend="${att.passStatus.name() == 'PASS' ? 'badge-pass' : 'badge-fail'}"
                                              th:text="${att.passStatus}">PASS</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(attempts)}">
                                    <td colspan="8" class="text-center text-muted py-4">No student has attended this examination yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
