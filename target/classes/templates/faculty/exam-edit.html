<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Examination - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='dashboard')}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/header :: navbar(pageTitle='Edit Examination Details')}"></div>

            <div class="p-4">
                <div class="glass-card p-4 p-md-5" style="max-width: 800px; margin: 0 auto;">
                    <h4 class="fw-bold mb-4"><i class="fas fa-edit me-2 text-primary"></i>Update Exam Settings</h4>

                    <form th:action="@{'/faculty/exams/' + ${exam.id} + '/edit'}" th:object="${examDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Examination Title</label>
                            <input type="text" th:field="*{title}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Subject</label>
                            <select th:field="*{subjectId}" class="form-select" required>
                                <option th:each="sub : ${subjects}" th:value="${sub.id}" th:text="${sub.code + ' - ' + sub.name}">Subject</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label text-secondary fw-semibold">Duration (Minutes)</label>
                                <input type="number" th:field="*{durationMinutes}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary fw-semibold">Passing Marks</label>
                                <input type="number" step="0.5" th:field="*{passingMarks}" class="form-control" required>
                            </div>
                        </div>

                        <div class="p-3 bg-surface rounded-3 border mb-4">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" th:field="*{questionRandomization}" id="qRand">
                                <label class="form-check-label fw-semibold text-secondary" for="qRand">Randomize Question Sequence</label>
                            </div>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" th:field="*{optionRandomization}" id="optRand">
                                <label class="form-check-label fw-semibold text-secondary" for="optRand">Randomize Option Choices</label>
                            </div>
                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input" type="checkbox" th:field="*{published}" id="pubStatus">
                                <label class="form-check-label fw-bold text-success" for="pubStatus">Published for Students</label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3">
                            <a href="/faculty/dashboard" class="btn btn-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-gradient px-4">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
