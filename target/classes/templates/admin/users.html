<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='users')}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/header :: navbar(pageTitle='User Account Management')}"></div>

            <div class="p-4">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h4 class="fw-bold mb-0">Registered Users</h4>
                    <button class="btn btn-primary-gradient" data-bs-toggle="modal" data-bs-target="#createFacultyModal">
                        <i class="fas fa-user-plus me-1"></i> Add Faculty Account
                    </button>
                </div>

                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div>
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div>

                <!-- USER MANAGEMENT TABLE -->
                <div class="glass-card p-4">
                    <div class="table-responsive">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Full Name</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${allUsers}">
                                    <td th:text="${user.id}">1</td>
                                    <td class="fw-semibold" th:text="${user.fullName}">Name</td>
                                    <td th:text="${user.username}">Username</td>
                                    <td th:text="${user.email}">Email</td>
                                    <td>
                                        <span class="badge bg-secondary" th:text="${user.role.name.replace('ROLE_', '')}">ROLE</span>
                                    </td>
                                    <td>
                                        <span class="badge-custom" th:classappend="${user.active ? 'badge-pass' : 'badge-fail'}"
                                              th:text="${user.active ? 'ACTIVE' : 'DEACTIVATED'}">Active</span>
                                    </td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <form th:action="@{'/admin/users/' + ${user.id} + '/toggle-status'}" method="post">
                                                <button type="submit" class="btn btn-sm btn-outline-warning" title="Toggle Active Status">
                                                    <i class="fas fa-power-off"></i>
                                                </button>
                                            </form>
                                            <form th:action="@{'/admin/users/' + ${user.id} + '/delete'}" method="post" onsubmit="return confirm('Are you sure you want to delete this user?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete User">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- CREATE FACULTY MODAL -->
            <div class="modal fade" id="createFacultyModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content glass-card border-0 p-3">
                        <div class="modal-header border-0">
                            <h5 class="modal-title fw-bold"><i class="fas fa-chalkboard-teacher me-2 text-primary"></i>New Faculty Account</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <form th:action="@{/admin/users/create-faculty}" method="post">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Full Name</label>
                                    <input type="text" name="fullName" class="form-control" placeholder="Dr. Sarah Smith" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Username</label>
                                    <input type="text" name="username" class="form-control" placeholder="prof_smith" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Email Address</label>
                                    <input type="email" name="email" class="form-control" placeholder="smith@university.edu" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Phone</label>
                                    <input type="text" name="phone" class="form-control" placeholder="+1 800-555-0100">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Password</label>
                                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>
                            <div class="modal-footer border-0">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary-gradient">Create Faculty Account</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
