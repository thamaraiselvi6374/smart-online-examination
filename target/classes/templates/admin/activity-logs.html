<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activity Logs - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='logs')}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/header :: navbar(pageTitle='Security & Examination Activity Audit Log')}"></div>

            <div class="p-4">
                <div class="glass-card p-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-shield-alt me-2 text-primary"></i>System Security & Proctoring Event Stream</h5>
                    <div class="table-responsive">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Timestamp</th>
                                    <th>User Account</th>
                                    <th>Action Type</th>
                                    <th>Event Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${logs}">
                                    <td th:text="${log.id}">1</td>
                                    <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">Time</td>
                                    <td class="fw-semibold" th:text="${log.user.fullName + ' (' + log.user.username + ')'}">User</td>
                                    <td>
                                        <span class="badge-custom" 
                                              th:classappend="${log.actionType == 'START' ? 'badge-active' : log.actionType == 'TAB_SWITCH_WARNING' ? 'badge-warning' : 'badge-pass'}"
                                              th:text="${log.actionType}">Action</span>
                                    </td>
                                    <td th:text="${log.description}">Details</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
