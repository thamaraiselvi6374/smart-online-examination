<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Result Summary - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        @media print {
            .app-sidebar, .app-navbar, .no-print { display: none !important; }
            .app-main { margin-left: 0 !important; }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='dashboard')}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/header :: navbar(pageTitle='Examination Evaluation Report')}"></div>

            <div class="p-4">
                <div class="glass-card p-4 p-md-5 mb-4 style-summary-card" style="max-width: 900px; margin: 0 auto;">
                    <!-- HEADER -->
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center border-bottom pb-4 mb-4">
                        <div>
                            <span class="badge bg-primary text-uppercase" th:text="${exam.subject.name}">Subject</span>
                            <h3 class="fw-bold mb-1 mt-1" th:text="${exam.title}">Exam Title</h3>
                            <div class="text-sm text-secondary">
                                Student: <strong th:text="${studentExam.student.fullName}">Student</strong> | 
                                Date: <span th:text="${#temporals.format(studentExam.submitTime, 'yyyy-MM-dd HH:mm')}">Date</span>
                            </div>
                        </div>
                        <div class="mt-3 mt-md-0 text-center">
                            <span class="badge-custom fs-5 px-4 py-2" 
                                  th:classappend="${studentExam.passStatus.name() == 'PASS' ? 'badge-pass' : 'badge-fail'}"
                                  th:text="${studentExam.passStatus}">PASS</span>
                        </div>
                    </div>

                    <!-- CIRCULAR SCORE GAUGE & METRICS -->
                    <div class="row align-items-center g-4 mb-4">
                        <div class="col-md-5 text-center">
                            <div class="position-relative d-inline-block">
                                <canvas id="resultDoughnutChart" style="max-width: 220px;"></canvas>
                                <div class="position-absolute top-50 start-50 translate-middle text-center">
                                    <div class="display-6 fw-bold text-primary" th:text="${studentExam.percentage + '%'}">80%</div>
                                    <div class="text-xs text-muted">Final Score</div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-7">
                            <div class="row g-3">
                                <div class="col-6">
                                    <div class="p-3 bg-surface rounded-3 border">
                                        <div class="text-xs text-muted text-uppercase">Marks Obtained</div>
                                        <div class="fs-4 fw-bold text-primary" th:text="${studentExam.marksObtained + ' / ' + studentExam.totalMarks}">16 / 20</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="p-3 bg-surface rounded-3 border">
                                        <div class="text-xs text-muted text-uppercase">Accuracy</div>
                                        <div class="fs-4 fw-bold text-success" th:text="${studentExam.accuracyPercentage + '%'}">85%</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-3 bg-surface rounded-3 border text-center">
                                        <div class="text-xs text-muted">Correct</div>
                                        <div class="fs-4 fw-bold text-success" th:text="${studentExam.correctAnswers}">4</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-3 bg-surface rounded-3 border text-center">
                                        <div class="text-xs text-muted">Wrong</div>
                                        <div class="fs-4 fw-bold text-danger" th:text="${studentExam.wrongAnswers}">1</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-3 bg-surface rounded-3 border text-center">
                                        <div class="text-xs text-muted">Unanswered</div>
                                        <div class="fs-4 fw-bold text-secondary" th:text="${studentExam.unanswered}">0</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ACTION BUTTONS -->
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center pt-4 border-top gap-3 no-print">
                        <a href="/student/dashboard" class="btn btn-outline-secondary px-4"><i class="fas fa-home me-1"></i> Dashboard</a>
                        <div class="d-flex gap-2">
                            <button onclick="window.print()" class="btn btn-outline-primary px-4"><i class="fas fa-print me-1"></i> Print / Download PDF</button>
                            <a th:href="@{'/student/results/' + ${studentExam.id} + '/review'}" class="btn btn-primary-gradient px-4"><i class="fas fa-eye me-1"></i> Answer Key Review</a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/charts.js}"></script>
    <script th:inline="javascript">
        /*[+
        const correct = /*[[${studentExam.correctAnswers}]]*/ 0;
        const wrong = /*[[${studentExam.wrongAnswers}]]*/ 0;
        const unanswered = /*[[${studentExam.unanswered}]]*/ 0;
        +]*/
        renderResultChart('resultDoughnutChart', correct, wrong, unanswered);
    </script>
</body>
</html>
