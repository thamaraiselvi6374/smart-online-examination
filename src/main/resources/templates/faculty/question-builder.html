<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Question Builder - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='dashboard')}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/header :: navbar(pageTitle='Exam Question Builder')}"></div>

            <div class="p-4">
                <!-- EXAM SUMMARY HEADER CARD -->
                <div class="glass-card p-4 mb-4">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                        <div>
                            <span class="badge bg-primary text-uppercase mb-1" th:text="${exam.subject.name}">Subject</span>
                            <h4 class="fw-bold mb-1" th:text="${exam.title}">Exam Title</h4>
                            <div class="text-sm text-secondary">
                                <span class="me-3"><i class="fas fa-clock me-1 text-primary"></i> <span th:text="${exam.durationMinutes}">20</span> mins</span>
                                <span class="me-3"><i class="fas fa-check-double me-1 text-success"></i> Passing Marks: <span th:text="${exam.passingMarks}">10.0</span></span>
                                <span><i class="fas fa-calculator me-1 text-warning"></i> Total Marks: <strong th:text="${exam.totalMarks}">20.0</strong></span>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <form th:action="@{'/faculty/exams/' + ${exam.id} + '/toggle-publish'}" method="post">
                                <button type="submit" class="btn btn-success px-3">
                                    <i class="fas" th:classappend="${exam.published ? 'fa-eye-slash' : 'fa-globe'}"></i>
                                    <span th:text="${exam.published ? ' Unpublish' : ' Publish Exam'}">Publish</span>
                                </button>
                            </form>
                            <a href="/faculty/dashboard" class="btn btn-outline-secondary">Done</a>
                        </div>
                    </div>
                </div>

                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div>
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div>

                <div class="row g-4">
                    <!-- ADD NEW QUESTION FORM -->
                    <div class="col-lg-6">
                        <div class="glass-card p-4">
                            <h5 class="fw-bold mb-3"><i class="fas fa-plus-circle me-2 text-primary"></i>Add Question</h5>
                            
                            <form th:action="@{'/faculty/exams/' + ${exam.id} + '/questions'}" th:object="${questionDto}" method="post" id="questionForm">
                                <input type="hidden" th:field="*{examId}">

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Question Type</label>
                                    <select th:field="*{questionType}" id="qTypeSelect" class="form-select" onchange="toggleOptionFields()" required>
                                        <option value="MCQ_SINGLE">MCQ (Single Choice)</option>
                                        <option value="MCQ_MULTIPLE">MCQ (Multiple Correct Choices)</option>
                                        <option value="TRUE_FALSE">True / False</option>
                                        <option value="FILL_BLANK">Fill in the Blank</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Question Text</label>
                                    <textarea th:field="*{questionText}" class="form-control" rows="3" placeholder="Enter full question description..." required></textarea>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary fw-semibold">Difficulty Level</label>
                                        <select th:field="*{difficulty}" class="form-select">
                                            <option value="EASY">Easy</option>
                                            <option value="MEDIUM" selected>Medium</option>
                                            <option value="HARD">Hard</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary fw-semibold">Marks Weightage</label>
                                        <input type="number" step="0.5" th:field="*{marks}" class="form-control" value="1.0" required>
                                    </div>
                                </div>

                                <!-- MCQ OPTIONS BLOCK -->
                                <div id="mcqOptionsBlock" class="p-3 bg-body rounded-3 border mb-3">
                                    <label class="form-label fw-bold text-primary mb-2">Answer Options & Correct Key</label>
                                    <div class="mb-2">
                                        <div class="input-group">
                                            <div class="input-group-text">
                                                <input class="form-check-input mt-0" type="radio" name="correctIndexRadio" value="0" checked id="radio0">
                                                <input type="hidden" name="options[0].correct" id="optCorrect0" value="true">
                                            </div>
                                            <input type="text" name="options[0].optionText" class="form-control" placeholder="Option A">
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <div class="input-group">
                                            <div class="input-group-text">
                                                <input class="form-check-input mt-0" type="radio" name="correctIndexRadio" value="1" id="radio1">
                                                <input type="hidden" name="options[1].correct" id="optCorrect1" value="false">
                                            </div>
                                            <input type="text" name="options[1].optionText" class="form-control" placeholder="Option B">
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <div class="input-group">
                                            <div class="input-group-text">
                                                <input class="form-check-input mt-0" type="radio" name="correctIndexRadio" value="2" id="radio2">
                                                <input type="hidden" name="options[2].correct" id="optCorrect2" value="false">
                                            </div>
                                            <input type="text" name="options[2].optionText" class="form-control" placeholder="Option C">
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <div class="input-group">
                                            <div class="input-group-text">
                                                <input class="form-check-input mt-0" type="radio" name="correctIndexRadio" value="3" id="radio3">
                                                <input type="hidden" name="options[3].correct" id="optCorrect3" value="false">
                                            </div>
                                            <input type="text" name="options[3].optionText" class="form-control" placeholder="Option D">
                                        </div>
                                    </div>
                                </div>

                                <!-- FILL IN BLANK BLOCK -->
                                <div id="blankBlock" class="p-3 bg-body rounded-3 border mb-3" style="display:none;">
                                    <label class="form-label fw-bold text-primary mb-2">Exact Answer Key</label>
                                    <input type="text" th:field="*{blankAnswer}" class="form-control" placeholder="Correct word or phrase (case insensitive)">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Answer Explanation (Optional)</label>
                                    <textarea th:field="*{explanation}" class="form-control" rows="2" placeholder="Rationale behind the correct answer..."></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary-gradient w-100">Add Question to Exam</button>
                            </form>
                        </div>
                    </div>

                    <!-- EXISTING QUESTIONS LIST -->
                    <div class="col-lg-6">
                        <div class="glass-card p-4">
                            <h5 class="fw-bold mb-3"><i class="fas fa-list me-2 text-primary"></i>Question Bank (<span th:text="${#lists.size(questions)}">0</span>)</h5>
                            
                            <div th:each="q, stat : ${questions}" class="p-3 bg-body rounded-3 border mb-3 position-relative">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge bg-primary text-sm" th:text="${'Q' + stat.count + ' (' + q.questionType + ')'}">Q1</span>
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="badge bg-secondary text-xs" th:text="${q.difficulty}">MEDIUM</span>
                                        <span class="badge bg-success text-xs" th:text="${q.marks + ' Marks'}">1 Mark</span>
                                        <form th:action="@{'/faculty/questions/' + ${q.id} + '/delete'}" method="post" onsubmit="return confirm('Delete this question?');">
                                            <input type="hidden" name="examId" th:value="${exam.id}">
                                            <button type="submit" class="btn btn-sm btn-link text-danger p-0 ms-2" title="Delete"><i class="fas fa-trash"></i></button>
                                        </form>
                                    </div>
                                </div>

                                <p class="fw-semibold mb-2" th:text="${q.questionText}">Question text</p>

                                <!-- OPTIONS DISPLAY -->
                                <ul class="list-unstyled text-sm mb-0 ms-2" th:if="${q.questionType != 'FILL_BLANK'}">
                                    <li th:each="opt : ${q.options}" class="mb-1" th:classappend="${opt.correct ? 'text-success fw-bold' : 'text-secondary'}">
                                        <i class="fas" th:classappend="${opt.correct ? 'fa-check-circle text-success' : 'fa-circle text-muted'}"></i>
                                        <span th:text="${opt.optionText}">Option</span>
                                    </li>
                                </ul>
                                <div class="text-sm text-success fw-bold mt-1" th:if="${q.questionType == 'FILL_BLANK'}">
                                    Answer Key: <span th:text="${q.blankAnswer}">Key</span>
                                </div>
                            </div>

                            <div th:if="${#lists.isEmpty(questions)}" class="text-center text-muted py-5">
                                <i class="fas fa-folder-open fs-1 text-muted opacity-50 mb-2"></i>
                                <p>No questions added yet. Use the form on the left to create questions.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        function toggleOptionFields() {
            const type = document.getElementById('qTypeSelect').value;
            const mcqBlock = document.getElementById('mcqOptionsBlock');
            const blankBlock = document.getElementById('blankBlock');

            if (type === 'FILL_BLANK') {
                mcqBlock.style.display = 'none';
                blankBlock.style.display = 'block';
            } else {
                mcqBlock.style.display = 'block';
                blankBlock.style.display = 'none';
            }
        }

        // Radio group listener to update hidden boolean inputs correctly
        document.querySelectorAll('input[name="correctIndexRadio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const idx = e.target.value;
                for (let i = 0; i < 4; i++) {
                    const hidden = document.getElementById(`optCorrect${i}`);
                    if (hidden) hidden.value = (i == idx) ? 'true' : 'false';
                }
            });
        });
    </script>
</body>
</html>
