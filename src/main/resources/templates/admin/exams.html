<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Examinations - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='exams')}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/header :: navbar(pageTitle='System Examinations Overview')}"></div>

            <div class="p-4">
                <div class="glass-card p-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-file-alt me-2 text-primary"></i>All Examinations Created in System</h5>
                    <div class="table-responsive">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Subject</th>
                                    <th>Faculty</th>
                                    <th>Duration</th>
                                    <th>Total Marks</th>
                                    <th>Passing Marks</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="exam : ${exams}">
                                    <td th:text="${exam.id}">1</td>
                                    <td class="fw-semibold" th:text="${exam.title}">Title</td>
                                    <td th:text="${exam.subject.name}">Subject</td>
                                    <td th:text="${exam.faculty.fullName}">Faculty</td>
                                    <td th:text="${exam.durationMinutes + ' mins'}">20 mins</td>
                                    <td th:text="${exam.totalMarks}">20.0</td>
                                    <td th:text="${exam.passingMarks}">10.0</td>
                                    <td>
                                        <span class="badge-custom" th:classappend="${exam.published ? 'badge-pass' : 'badge-warning'}"
                                              th:text="${exam.published ? 'PUBLISHED' : 'DRAFT'}">Published</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
