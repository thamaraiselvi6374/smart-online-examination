<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Subjects - Smart Online Examination System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='subjects')}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/header :: navbar(pageTitle='Academic Subjects Management')}"></div>

            <div class="p-4">
                <div class="row g-4">
                    <!-- ADD SUBJECT FORM -->
                    <div class="col-md-4">
                        <div class="glass-card p-4">
                            <h5 class="fw-bold mb-3"><i class="fas fa-plus-circle me-2 text-primary"></i>Add New Subject</h5>
                            <form th:action="@{/admin/subjects}" th:object="${newSubject}" method="post">
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Subject Code</label>
                                    <input type="text" th:field="*{code}" class="form-control" placeholder="CS101" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Subject Name</label>
                                    <input type="text" th:field="*{name}" class="form-control" placeholder="Java Programming & OOP" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Description</label>
                                    <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Subject scope & syllabus details..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary-gradient w-100">Save Subject</button>
                            </form>
                        </div>
                    </div>

                    <!-- SUBJECTS LIST TABLE -->
                    <div class="col-md-8">
                        <div class="glass-card p-4">
                            <h5 class="fw-bold mb-3"><i class="fas fa-book me-2 text-primary"></i>Academic Subjects</h5>
                            <div class="table-responsive">
                                <table class="table-custom">
                                    <thead>
                                        <tr>
                                            <th>Code</th>
                                            <th>Name</th>
                                            <th>Description</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="sub : ${subjects}">
                                            <td class="fw-bold" th:text="${sub.code}">CS101</td>
                                            <td th:text="${sub.name}">Java Programming</td>
                                            <td class="text-sm text-secondary" th:text="${sub.description}">Description</td>
                                            <td>
                                                <span class="badge-custom" th:classappend="${sub.active ? 'badge-pass' : 'badge-fail'}"
                                                      th:text="${sub.active ? 'ACTIVE' : 'INACTIVE'}">Active</span>
                                            </td>
                                            <td>
                                                <form th:action="@{'/admin/subjects/' + ${sub.id} + '/toggle'}" method="post">
                                                    <button type="submit" class="btn btn-sm btn-outline-warning" title="Toggle Status">
                                                        <i class="fas fa-power-off"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
