# Application Name
spring.application.name=smart-online-examination

# Server Port
server.port=8080

# Database Configuration
# Default setup uses H2 file-based DB so the application runs immediately without requiring MySQL pre-installed.
# To switch to MySQL, uncomment the MySQL section below and comment out the H2 section.

# --- H2 Database Setup (Zero-Config Default) ---
spring.datasource.url=jdbc:h2:mem:smart_exam_system;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL Database Setup (Production / MySQL Assignment) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/smart_exam_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-className=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Max Sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.org.springframework.security=WARN
logging.level.com.smartexam=INFO
